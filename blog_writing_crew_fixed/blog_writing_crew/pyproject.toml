[project]
name = "blog_writing_crew"
version = "0.1.0"
description = "blog-writing-crew using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai[tools]==1.14.4",
    "litellm>=1.83.7",
]

[project.scripts]
blog_writing_crew = "blog_writing_crew.main:run"
run_crew = "blog_writing_crew.main:run"
train = "blog_writing_crew.main:train"
replay = "blog_writing_crew.main:replay"
test = "blog_writing_crew.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blog_writing_crew"]

[tool.crewai]
type = "crew"

[tool.uv]
override-dependencies = [
    "openai>=2.24.0",
]
